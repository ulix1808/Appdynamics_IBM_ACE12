# Configuración Redis para PoC ACE 13 (desarrollo local)
bind 0.0.0.0
port 6379
protected-mode no

# Persistencia ligera para validar TTL y recuperación
appendonly yes
appendfsync everysec
save 60 1000

# Límite de memoria (ajustar según entorno)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logs
loglevel notice
