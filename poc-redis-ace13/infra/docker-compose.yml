# Redis para PoC IBM ACE 13
# Uso: docker compose -f infra/docker-compose.yml up -d

services:
  redis:
    image: redis:7.2-alpine
    container_name: ace13-poc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: ace13-poc-redis-insight
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - ui

volumes:
  redis-data:
  redis-insight-data:
